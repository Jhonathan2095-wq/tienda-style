<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restablecer contraseña - STYLE</title>
<style>
  body { font-family: Arial, sans-serif; background:#f8f9fa; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
  .box { background:#fff; padding:32px; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.15); width:100%; max-width:380px; }
  h2 { margin-top:0; color:#111; }
  input { width:100%; padding:12px 14px; margin-bottom:14px; border:1px solid #ddd; border-radius:6px; font-size:15px; box-sizing:border-box; }
  button { width:100%; padding:13px; background:#111; color:#d4af37; border:none; border-radius:6px; font-weight:bold; font-size:15px; cursor:pointer; }
  button:hover { background:#333; }
  #msg { font-size:14px; margin-top:12px; text-align:center; }
</style>
</head>
<body>
  <div class="box">
    <h2>🔑 Nueva contraseña</h2>
    <input type="password" id="pass1" placeholder="Nueva contraseña (mín. 6 caracteres)">
    <input type="password" id="pass2" placeholder="Confirmar nueva contraseña">
    <button onclick="enviar()">Actualizar contraseña</button>
    <div id="msg"></div>
  </div>

  <script>
    function getToken() {
      const params = new URLSearchParams(window.location.search);
      return params.get('token');
    }

    async function enviar() {
      const token = getToken();
      const p1 = document.getElementById('pass1').value;
      const p2 = document.getElementById('pass2').value;
      const msg = document.getElementById('msg');

      if (!token) { msg.textContent = '❌ Enlace inválido. Solicita uno nuevo.'; msg.style.color = '#e53e3e'; return; }
      if (p1.length < 6) { msg.textContent = '⚠️ La contraseña debe tener al menos 6 caracteres.'; msg.style.color = '#e53e3e'; return; }
      if (p1 !== p2) { msg.textContent = '⚠️ Las contraseñas no coinciden.'; msg.style.color = '#e53e3e'; return; }

      try {
        const res = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, contrasena: p1 })
        });
        const data = await res.json();
        if (data.success) {
          msg.style.color = '#2e7d32';
          msg.textContent = '✅ Contraseña actualizada. Ya puedes iniciar sesión.';
          setTimeout(() => { window.location.href = '/'; }, 2000);
        } else {
          msg.style.color = '#e53e3e';
          msg.textContent = '❌ ' + (data.message || 'No se pudo actualizar la contraseña.');
        }
      } catch (err) {
        msg.style.color = '#e53e3e';
        msg.textContent = '❌ No se pudo conectar con el servidor.';
      }
    }
  </script>
</body>
</html>
